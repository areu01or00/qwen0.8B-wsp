<!doctype html>
<html><head><meta charset="utf-8"><title>WSP film</title>
<style>html,body{margin:0;background:#030406;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
// Light on black, one ember ramp + silver, JetBrains Mono (x-taste brief). Every point is a real weight of Qwen3.5-0.8B's
// mlp.down_proj (sampled); the edited layers' points carry the real |dW| of the write. render(t) is pure: same t, same frame.
const W = 1920, H = 1080, cv = document.getElementById('c'); cv.width = W; cv.height = H;
const g = cv.getContext('2d', { willReadFrequently: true });
const EMBER = ['#170600', '#7c2608', '#ff8a3d', '#ffb547', '#fff0dc'], SILVER = '#cdd7ec', MUTED = '#6f7a8c', BG = '#030406';
const MONO = '"JetBrainsMono Nerd Font", "JetBrains Mono", monospace';
let D = null;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const win = (t, a, b, fi = .6, fo = .6) => Math.min(ease((t - a) / fi), ease((b - t) / fo));
function rng(s) { return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

function wrap(text, width, font) {
  g.font = font; const out = []; let line = '';
  for (const word of text.split(/(\s+)/)) {
    if (word === '\n') { out.push(line); line = ''; continue; }
    const next = line + word;
    if (g.measureText(next).width > width && line.trim()) { out.push(line.trimEnd()); line = word.trimStart(); }
    else line = next;
  }
  if (line) out.push(line); return out;
}
function typed(text, t, cps) { return text.slice(0, Math.max(0, Math.floor(t * cps))); }
function textAt(s, x, y, size, color, alpha = 1, weight = 400, align = 'left') {
  g.globalAlpha = alpha; g.fillStyle = color; g.font = `${weight} ${size}px ${MONO}`; g.textAlign = align; g.fillText(s, x, y); g.globalAlpha = 1; g.textAlign = 'left';
}
function inscribe(s, x, y, size, color, t, cps = 28, align = 'left', weight = 400) {
  const n = Math.max(0, t * cps); const full = Math.floor(n);
  g.font = `${weight} ${size}px ${MONO}`; g.textAlign = 'left';
  const sx = align === 'center' ? x - g.measureText(s).width / 2 : x;     // the line's final position: letters land in place
  const shown = s.slice(0, full); const a0 = g.globalAlpha; g.fillStyle = color; g.fillText(shown, sx, y);
  if (full < s.length) {             // the next letter arrives as light
    g.globalAlpha = a0 * (n - full); g.fillStyle = EMBER[4]; g.fillText(s[full], sx + g.measureText(shown).width, y); g.globalAlpha = a0;
  }
}

// ---------- the model as light ----------
function strands(t, a, b, ignite) {
  // 24 vertical strands, one per layer; points = sampled weights (brightness |w|); edited layers flare with |dW|
  const A = win(t, a, b, 1.2, 1.0); if (A <= 0) return;
  const L = D.layers.length, x0 = 260, x1 = 1660, top = 250, bot = 900;
  g.globalCompositeOperation = 'lighter';
  for (let l = 0; l < L; l++) {
    const lay = D.layers[l], x = x0 + (x1 - x0) * l / (L - 1), edited = lay.d != null;
    const wave = edited ? ease((ignite - (lay.i - D.edited[0]) * .35)) : 0;   // the write climbs 17 -> 21
    const pts = lay.w.length;
    for (let k = 0; k < pts; k++) {
      const yy = top + (bot - top) * (k / pts) + Math.sin(k * 12.9898 + t * .4) * 2;
      const xx = x + (lay.jx[k] - .5) * 34 + Math.sin(t * .6 + k) * .6;
      const br = Math.min(1, lay.w[k] * 1.6) * .55 * A;
      g.fillStyle = `rgba(205,215,236,${br * .5})`; g.fillRect(xx, yy, 1.4, 1.4);
      if (edited && wave > 0) {
        const dv = Math.min(1, lay.d[k] * 2.2) * wave * A, pulse = .75 + .25 * Math.sin(t * 3 + k * .7);
        if (dv > .04) { g.fillStyle = `rgba(255,${Math.round(110 + 80 * dv)},${Math.round(40 + 30 * dv)},${dv * pulse})`; g.fillRect(xx - .6, yy - .6, 2.4, 2.4); }
      }
    }
    textAt(String(lay.i), x, bot + 38, 15, edited && ignite > .2 ? EMBER[3] : MUTED, A * (edited ? 1 : .6), 400, 'center');
  }
  g.globalCompositeOperation = 'source-over';
}

function header(t, a, b, q, tag) {
  const A = win(t, a, b, .5, .5); if (A <= 0) return;
  g.globalAlpha = A; textAt(tag, 140, 120, 18, EMBER[2], A); inscribe(q, 140, 168, 34, SILVER, (t - a) * 1.0, 40); g.globalAlpha = 1;
}

function column(t, a, b, x, label, color, text, cps) {
  const A = win(t, a, b, .5, .7); if (A <= 0) return;
  textAt(label, x, 270, 18, color === SILVER ? MUTED : EMBER[2], A, 600);
  g.globalAlpha = A; g.fillStyle = color === SILVER ? 'rgba(205,215,236,.25)' : 'rgba(255,138,61,.5)'; g.fillRect(x, 288, 760, 1); g.globalAlpha = 1;
  const lines = wrap(typed(text, t - a - .6, cps), 760, `400 27px ${MONO}`);
  lines.slice(0, 15).forEach((ln, i) => textAt(ln, x, 340 + i * 42, 27, color, A));
}

function glowDot(x, y, r, a) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(255,240,220,${a})`); gr.addColorStop(.3, `rgba(255,138,61,${a * .5})`); gr.addColorStop(1, 'rgba(23,6,0,0)');
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
}

function dust(t) {   // slow ambient stardust, sparse
  const r = rng(7); g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 260; i++) {
    const x = r() * W, y = (r() * H + t * (4 + r() * 8)) % H, a = .05 + .12 * r() * (.6 + .4 * Math.sin(t * 1.3 + i));
    g.fillStyle = `rgba(255,181,71,${a})`; g.fillRect(x, y, 1.2, 1.2);
  }
  g.globalCompositeOperation = 'source-over';
}

function render(t) {
  g.fillStyle = BG; g.fillRect(0, 0, W, H); dust(t);
  const S = D.script;
  // 1. thesis
  { const A = win(t, .3, 6.2, .8, .8);
    if (A > 0) { g.globalAlpha = A;
      inscribe('Teaching facts to a model is possible.', W / 2, 500, 54, EMBER[4], t - .5, 26, 'center', 600);
      if (t > 2.6) inscribe('weight space programming · no training · no gradients', W / 2, 570, 22, EMBER[2], t - 2.6, 40, 'center');
      g.globalAlpha = 1; } }
  // 2. the model, the write lands
  strands(t, 6.4, 17.2, (t - 10.4) / 1.6);
  { const A = win(t, 6.6, 17.0, .6, .6);
    if (A > 0) {
      textAt('Qwen3.5-0.8B · 24 layers · every point is one of its weights', 140, 120, 22, MUTED, A);
      if (t > 9.4) inscribe(`write: "${S.fact}"`, 140, 170, 24, SILVER, t - 9.4, 45);
      if (t > 12.2) inscribe('one closed-form solve per layer · mlp.down_proj of layers 17–21 · 5 of 488 tensors', 140, 210, 20, EMBER[3], t - 12.2, 45);
    } }
  // 3. base vs patched on a wording it was never taught
  let t0 = 17.6;
  for (const ex of S.examples) {
    const dur = ex.dur;
    header(t, t0, t0 + dur, ex.q, ex.tag);
    column(t, t0 + .4, t0 + dur, 140, 'STOCK QWEN3.5-0.8B', SILVER, ex.base, ex.cps || 34);
    column(t, t0 + .4, t0 + dur, 1020, 'AFTER THE WRITE', EMBER[4], ex.mod, ex.cps || 34);
    t0 += dur;
  }
  // 4. end card
  { const A = win(t, t0 + .2, S.end, .8, .4);
    if (A > 0) { g.globalAlpha = A;
      glowDot(W / 2, 380, 120, .35 * A);
      inscribe(S.endline, W / 2, 470, 44, EMBER[4], t - t0 - .4, 30, 'center', 600);
      if (t > t0 + 2) inscribe(S.endsub, W / 2, 535, 22, SILVER, t - t0 - 2, 40, 'center');
      if (t > t0 + 3.4) inscribe(S.repo, W / 2, 640, 26, EMBER[3], t - t0 - 3.4, 40, 'center');
      if (t > t0 + 4.2) inscribe('@TensorSlay', W / 2, 690, 22, MUTED, t - t0 - 4.2, 40, 'center');
      g.globalAlpha = 1; } }
}

async function main() {
  D = await (await fetch('film.json')).json();
  await document.fonts.load(`600 40px "JetBrainsMono Nerd Font"`); await document.fonts.load(`400 20px "JetBrainsMono Nerd Font"`);
  const job = await (await fetch('/job.json')).json().catch(() => null);
  if (!job) {               // preview: play in real time
    const t0 = performance.now(); const loop = () => { render(((performance.now() - t0) / 1000) % D.script.end); requestAnimationFrame(loop); }; loop(); return;
  }
  for (let i = job.from; i < job.to; i++) {
    render(i / job.fps);
    const px = g.getImageData(0, 0, W, H).data;
    await fetch('/frame', { method: 'POST', body: px });
  }
  await fetch('/done', { method: 'POST' });
}
main();
</script></body></html>
